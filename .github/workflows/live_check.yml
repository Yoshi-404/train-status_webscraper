name: Weekly Live Check

# Yahoo!路線情報のレイアウト変更を週次で監視するワークフロー。
# 通常のCI（PRやpush）とは分離し、Yahoo側の変動で通常のビルドが失敗するのを防止します。
on:
  schedule:
    # 毎週日曜日 00:00 UTC に自動実行
    - cron: '0 0 * * 0'
  workflow_dispatch: # 手動実行用

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run live search against Yahoo! Transit
      env:
        LIVE_TESTS: "1"
      run: |
        python -m unittest tests.test_train.TestLiveSearch -v
