[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "train-status-webscraper"
version = "0.1.0"
description = "Japanese nationwide transit route search and scraper using Yahoo! Transit."
readme = "README.md"
authors = [
    { name = "Arakaki Yoshinori", email = "arakaki.yan.jp@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "japan",
    "train",
    "transit",
    "webscraper",
    "yahoo-transit",
    "shinkansen",
    "route-search"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
]

[project.scripts]
train-search = "train:main"
train = "train:main"

[project.urls]
"Homepage" = "https://github.com/Yoshi-404/train-status_webscraper"
"Repository" = "https://github.com/Yoshi-404/train-status_webscraper"
"Bug Tracker" = "https://github.com/Yoshi-404/train-status_webscraper/issues"

[tool.setuptools]
py-modules = ["train"]
